services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: immolib
      POSTGRES_USER: immolib
      POSTGRES_PASSWORD: immolib
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immolib -d immolib"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - immolib_postgres_data:/var/lib/postgresql/data

volumes:
  immolib_postgres_data:
