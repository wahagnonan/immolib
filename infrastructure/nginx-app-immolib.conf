# Site nginx pour ImmoLib (production)
# Installation :
#   sudo cp infrastructure/nginx-app-immolib.conf /etc/nginx/sites-available/immolib
#   sudo ln -s /etc/nginx/sites-available/immolib /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# TLS (certbot) :
#   sudo certbot --nginx -d app.immolib.ci
#   sudo certbot renew --dry-run

server {
    listen 80;
    server_name app.immolib.ci;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.immolib.ci;

    # Remplis par certbot (lignes ssl_certificate / ssl_certificate_key)
    ssl_certificate /etc/letsencrypt/live/app.immolib.ci/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.immolib.ci/privkey.pem;

    client_max_body_size 20m;

    # Le frontend Next.js (web:3000) relaie /backend/* vers l'API Django.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
