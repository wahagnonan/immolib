name: CI

on:
  push:
    branches: [main, "feat/**", "ci/**", "ops/**", "docs/**"]
  pull_request:
    branches: [main]

env:
  DJANGO_SECRET_KEY: ci-test-key-not-for-production
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: localhost
  DATABASE_ENGINE: sqlite
  NEXT_PUBLIC_API_URL: /backend
  PUBLIC_APP_URL: http://localhost:3000

jobs:
  backend:
    name: Backend (Django)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier les migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Vérifier la configuration Django
        run: python manage.py check

      - name: Exécuter les tests Django
        run: python manage.py test --verbosity=2

  frontend-lint:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Auditer les dépendances de production
        run: npm audit --omit=dev

      - name: ESLint
        run: npm run lint

      - name: Build Next.js
        run: npm run build

  frontend-unit:
    name: Frontend (Tests unitaires)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tests Vitest
        run: npm run test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: immolib
          POSTGRES_USER: immolib
          POSTGRES_PASSWORD: immolib
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready -U immolib -d immolib
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Installer les dépendances Python
        run: pip install -r requirements.txt
        working-directory: apps/api

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Installer les dépendances Node
        run: npm ci
        working-directory: apps/web

      - name: Installer les navigateurs Playwright
        run: npx playwright install chromium

      - name: Appliquer les migrations Django
        run: python manage.py migrate
        working-directory: apps/api
        env:
          DATABASE_ENGINE: postgresql
          POSTGRES_HOST: localhost

      - name: Démarrer le backend Django
        run: |
          python manage.py runserver 0.0.0.0:8000 &
          sleep 3
        working-directory: apps/api
        env:
          DATABASE_ENGINE: postgresql
          POSTGRES_HOST: localhost

      - name: Démarrer le frontend Next.js
        run: |
          npm run dev &
          sleep 5
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: /backend
          API_INTERNAL_URL: http://127.0.0.1:8000

      - name: Exécuter les tests Playwright
        run: npx playwright test
        working-directory: apps/web
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: Uploader le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  secret-scan:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
